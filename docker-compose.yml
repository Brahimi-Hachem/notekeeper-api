services:
  postgres:
    image: postgres:17
    container_name: notekeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notekeeper
      POSTGRES_USER: notekeeper
      POSTGRES_PASSWORD: notekeeper_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notekeeper -d notekeeper"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: notekeeper-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://notekeeper:notekeeper_dev@postgres:5432/notekeeper
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    volumes:
      - .:/app:cached
    command: ["sh", "-c", "./docker-entrypoint.sh"]

volumes:
  postgres_data:
