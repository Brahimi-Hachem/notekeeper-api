[project]
name = "notekeeper-api"
version = "0.1.0"
description = "A production-oriented REST API for personal notes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.26.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
